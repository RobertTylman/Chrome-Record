<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exporting - Chrome Recorder</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #6b7280;
      --accent: #3b82f6;
      --track: #e5e7eb;
      --error: #d62828;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --card: #262626;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #4ade80;
        --track: #3f3f46;
        --error: #f87171;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    main {
      width: min(520px, calc(100vw - 32px));
      background: var(--card);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
    .item { margin-bottom: 16px; }
    .item-name { font-size: 14px; margin-bottom: 6px; overflow-wrap: anywhere; }
    .bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
    .item-status { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .item-status.error { color: var(--error); }
    #summary { font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Preparing download…</h1>
    <p class="hint" id="hint">You can switch to other tabs. Keep this tab open until the download starts.</p>
    <div id="items"></div>
    <p id="summary"></p>
  </main>
</body>
</html>
